<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro 2026 - Visão Mês a Mês</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --card-border: #243049;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --row-even: #0f172a;
      --row-odd: #141f36;
      --row-hover: #1e2e4f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Header */
    header {
      background: #111827;
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-badge {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #10b981 0%, #0284c7 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      font-size: 0.7rem;
      background: #10b98122;
      color: #34d399;
      border: 1px solid #10b98155;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-box {
      position: relative;
    }
    .search-box input {
      background: #1f293d;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 7px 12px 7px 34px;
      font-size: 0.85rem;
      color: #fff;
      outline: none;
      width: 260px;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      background: #243049;
    }
    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      fill: var(--text-muted);
    }
    .btn-download {
      background: #10b981;
      color: #fff;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-download:hover { background: #059669; }

    /* Main Tabs Bar */
    .main-tabs-bar {
      background: #111827;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      gap: 6px;
      padding: 6px 20px 0;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .main-tab {
      background: transparent;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .main-tab:hover {
      color: #fff;
      background: #1e293b66;
    }
    .main-tab.active {
      background: #151d30;
      color: var(--accent);
      border-color: var(--card-border);
      font-weight: 600;
      border-bottom: 2px solid var(--accent);
    }

    /* Month Sub-Tabs Bar */
    .month-subtabs-bar {
      background: #151d30;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .subtab-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-right: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .month-tab {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .month-tab:hover {
      background: #1e293b;
      color: #fff;
    }
    .month-tab.active {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
      font-weight: 700;
    }
    .month-tab.has-data {
      border-left: 3px solid #10b981;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* KPI Summary Cards */
    .kpi-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      padding: 16px 20px 0;
      flex-shrink: 0;
    }
    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .kpi-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .kpi-value {
      font-size: 1.25rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }
    .kpi-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .val-green { color: #34d399; }
    .val-blue { color: #38bdf8; }
    .val-amber { color: #fbbf24; }
    .val-red { color: #f87171; }

    /* Spreadsheet Table */
    .spreadsheet-wrapper {
      flex: 1;
      overflow: auto;
      margin: 14px 20px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      position: relative;
    }
    table.sheet-table {
      border-collapse: collapse;
      font-size: 0.82rem;
      width: max-content;
      min-width: 100%;
    }
    table.sheet-table th, table.sheet-table td {
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      text-align: left;
      white-space: nowrap;
    }
    table.sheet-table th.row-idx-hdr {
      width: 40px;
      background: #090d16;
      color: #64748b;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      position: sticky;
      left: 0;
      z-index: 10;
    }
    table.sheet-table td.row-idx {
      background: #090d16;
      color: #64748b;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      position: sticky;
      left: 0;
      z-index: 5;
    }
    table.sheet-table tr.header-row th {
      background: #111827;
      color: var(--accent);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 8;
      border-bottom: 2px solid var(--accent);
    }
    table.sheet-table tr.data-row:nth-child(even) { background: var(--row-even); }
    table.sheet-table tr.data-row:nth-child(odd) { background: var(--row-odd); }
    table.sheet-table tr.data-row:hover { background: var(--row-hover); }

    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .empty-state-text {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-pago { background: #065f46; color: #34d399; }
    .badge-pendente { background: #854d0e; color: #fde047; }
    .badge-atrasado { background: #991b1b; color: #fca5a5; }
    .badge-entregue { background: #075985; color: #7dd3fc; }
    .badge-nao-entregue { background: #334155; color: #cbd5e1; }
    
    .num-val {
      font-family: 'JetBrains Mono', monospace;
      text-align: right;
    }
    .currency { color: #34d399; font-weight: 600; }
    .currency-neg { color: #f87171; font-weight: 600; }

    /* Footer */
    footer {
      background: #111827;
      border-top: 1px solid var(--card-border);
      padding: 8px 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
  </style>
</head>

    function formatExcelDate(val) {
      if (typeof val === 'number' && val > 40000 && val < 55000) {
        const utc_days = Math.floor(val - 25569);
        const utc_value = utc_days * 86400;
        const date_info = new Date(utc_value * 1000);
        return date_info.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
      }
      return val;
    }

    function formatCell(val, colIdx) {
      if (val === null || val === undefined || val === '') return '';
      
      if (typeof val === 'number' && val > 40000 && val < 55000) {
        return '<span style="color:#93c5fd;font-family:JetBrains Mono,monospace;">' + formatExcelDate(val) + '</span>';
      }

      if (typeof val === 'number') {
        const formatted = val.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        return '<span class="num-val ' + (val < 0 ? 'currency-neg' : 'currency') + '">R$ ' + formatted + '</span>';
      }

      const s = String(val).trim();

      if (s.includes('✅') || s === 'Pago') return '<span class="badge badge-pago">' + s + '</span>';
      if (s.includes('⏳') || s === 'Pendente') return '<span class="badge badge-pendente">' + s + '</span>';
      if (s.includes('🛑') || s.includes('❌') || s === 'Atrasado') return '<span class="badge badge-atrasado">' + s + '</span>';
      if (s === 'Entregue') return '<span class="badge badge-entregue">' + s + '</span>';
      if (s === 'Não Entregue') return '<span class="badge badge-nao-entregue">' + s + '</span>';

      return s;
    }

      });
      document.getElementById('searchInput').value = '';
      renderContent();

    function switchMonth(month) {

    function renderKPIs() {
      const kpiContainer = document.getElementById('kpiCardsGrid');
      kpiContainer.innerHTML = '';

      const rawEntradas = SHEETS_DATA['Entradas'] || [];
      const rawEmpresa = SHEETS_DATA['🏢 Empresa'] || [];
      const rawPessoal = SHEETS_DATA['👤 Pessoal'] || [];

      function sumMonth(rows, headerIdx, valColIdx, monthColIdx) {
        let total = 0;
        let count = 0;
        for (let i = headerIdx + 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || r.length === 0) continue;
          const m = String(r[monthColIdx] || '').trim();
          if (selectedMonth !== 'Todos') {
            if (m.toLowerCase() !== selectedMonth.toLowerCase()) continue;
          }
          const val = Number(r[valColIdx]) || 0;
          total += val;
          if (val > 0) count++;
        }
        return { total, count };
      }

      const kpiEntradas = sumMonth(rawEntradas, 3, 3, 0);
      const kpiEmpresa = sumMonth(rawEmpresa, 3, 6, 0);
      const kpiPessoal = sumMonth(rawPessoal, 3, 5, 0);

      const lucroPJ = kpiEntradas.total - kpiEmpresa.total;
      const saldoFinal = lucroPJ - kpiPessoal.total;

      const monthLabel = selectedMonth === 'Todos' ? 'Todos os Meses' : selectedMonth;

      kpiContainer.innerHTML = `
        <div class="kpi-card">
          <div class="kpi-title">📥 Entradas (${monthLabel})</div>
          <div class="kpi-value val-green">R$ ${kpiEntradas.total.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
          <div class="kpi-sub">${kpiEntradas.count} lançamentos</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">🏢 Despesas PJ (${monthLabel})</div>
          <div class="kpi-value val-amber">R$ ${kpiEmpresa.total.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
          <div class="kpi-sub">${kpiEmpresa.count} contas da empresa</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">💼 Lucro Operacional PJ</div>
          <div class="kpi-value ${lucroPJ >= 0 ? 'val-blue' : 'val-red'}">R$ ${lucroPJ.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
          <div class="kpi-sub">Receitas - Custos PJ</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">👤 Despesas Pessoais PF</div>
          <div class="kpi-value val-red">R$ ${kpiPessoal.total.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
          <div class="kpi-sub">${kpiPessoal.count} despesas pessoais</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">💰 Saldo Líquido Final</div>
          <div class="kpi-value ${saldoFinal >= 0 ? 'val-green' : 'val-red'}">R$ ${saldoFinal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
          <div class="kpi-sub">Sobra Real (PJ - PF)</div>
        </div>
      `;
    }

        const trHdr = document.createElement('tr');
        trHdr.className = 'header-row';
        const thIdx = document.createElement('th');
        thIdx.className = 'row-idx-hdr';
        thIdx.innerText = '#';
        trHdr.appendChild(thIdx);
        headerRow.forEach(h => {
          const th = document.createElement('th');
          th.innerText = h;
          trHdr.appendChild(th);
        });
        tbody.appendChild(trHdr);
      }

      let displayedCount = 0;

      const isSpecialSheet = activeSheet.includes('Dashboard') || activeSheet.includes('Resumo');

      rows.forEach((row, rowIdx) => {
        if (!row || row.length === 0) return;
        if (headerRowIdx !== -1 && rowIdx <= headerRowIdx) return;
        if (row.every(c => c === null || c === undefined || c === '')) return;

        const firstCol = String(row[0] || '').trim();
        const isSummary = firstCol.startsWith('📊') || firstCol.startsWith('📌') || firstCol.startsWith('🔢') || firstCol.toLowerCase().includes('total');

        // Filtro estrito de mês para abas de lançamentos (Entradas, Empresa, Pessoal, Clientes)
        if (!isSpecialSheet && selectedMonth !== 'Todos') {
          const rowMonth = firstCol.toLowerCase();
          if (rowMonth !== selectedMonth.toLowerCase()) {
            return; // Se o mês da linha for diferente do mês selecionado, NÃO EXIBIR!
          }
        }

        displayedCount++;

        const tr = document.createElement('tr');
        tr.className = isSummary ? 'total-row' : 'data-row';

        const tdIdx = document.createElement('td');
        tdIdx.className = 'row-idx';
        tdIdx.innerText = displayedCount;
        tr.appendChild(tdIdx);

        row.forEach((cellVal, colIdx) => {
          const td = document.createElement('td');
          td.innerHTML = formatCell(cellVal, colIdx);
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      if (displayedCount === 0) {
        const trEmpty = document.createElement('tr');
        const tdEmpty = document.createElement('td');
        tdEmpty.colSpan = (headerRow ? headerRow.length + 1 : 10);
        tdEmpty.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📂</div>
            <div class="empty-state-text">Nenhum lançamento cadastrado para o mês de <strong>${selectedMonth}</strong> nesta aba.</div>
          </div>
        `;
        trEmpty.appendChild(tdEmpty);
        tbody.appendChild(trEmpty);
      }

      document.getElementById('footerStatus').innerHTML = `Aba: <strong>${activeSheet}</strong> | Mês: <strong>${selectedMonth}</strong> | Lançamentos exibidos: <strong>${displayedCount}</strong>`;
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#sheetBody tr.data-row');
      rows.forEach(tr => {
        const text = tr.innerText.toLowerCase();
        tr.style.display = text.includes(query) ? '' : 'none';
      });
    }

    renderContent();
  </script>
</body>
</html>
